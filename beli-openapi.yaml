        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-app-method: getCountRankedThisYear
      x-verified: true
  /api/creator-subscribe/:
    get:
      operationId: getCreatorSubscribe
