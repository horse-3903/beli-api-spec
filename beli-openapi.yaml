            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-app-method: getCreatorSubscribers
    post:
      summary: Post creator subscribe
      operationId: postCreatorSubscribe
      tags:
      - feed
      x-source: app-code
      responses:
        '200':
          description: ok
      x-app-method: postCreatorSubscribe
  /api/datauserinteger/:
    get:
      operationId: getDatauserinteger
      tags:
      - profile
      security:
      - bearerAuth: []
      summary: EAV integer-valued user fields (generic field layer, see reference §4)
      parameters:
