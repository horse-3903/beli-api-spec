        in: query
        required: true
        schema:
          type: string
        description: Sent by the app (read from the Beli 10.2.0 client).
      - name: field__name
        in: query
        required: true
        schema:
          type: string
        description: Sent by the app (read from the Beli 10.2.0 client).
      - name: value
        in: query
        required: false
        schema:
          type: string
        description: Sent by the app (read from the Beli 10.2.0 client).
      responses:
        '200':
          description: ok (shape observed live)
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    nullable: true
                  previous:
                    nullable: true
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        start_dt:
                          type: string
                        end_dt:
                          nullable: true
                        value:
                          type: integer
                        field:
                          type: integer
                        user:
                          type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-app-method: getDataUserInteger
      x-verified: true
    post:
      summary: Post data user integer
      operationId: postDataUserInteger
      tags:
      - feed
      x-source: app-code
      responses:
        '200':
          description: ok
      x-app-method: postDataUserInteger
