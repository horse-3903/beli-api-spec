      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: year
        in: query
        required: false
        schema:
          type: string
        description: Sent by the app (read from the Beli 10.2.0 client).
      responses:
        '200':
          description: ok (shape observed live)
          content:
            application/json:
              schema:
