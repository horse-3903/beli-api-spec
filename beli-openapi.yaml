openapi: 3.1.0
info:
  title: Beli API (Unofficial)
  version: 0.2.0
  description: 'Unofficial, community-maintained, reverse-engineered documentation of the Beli app backend. Not affiliated
    with or endorsed by Beli; it can change at any time. Use only your own account.


    Sources: the repository''s HAR-based spec, the Beli 10.2.0 web client code, and live checks against one account. Operations
    tagged `x-source: app-code` were read from the client and have not been exercised; `x-verified: true` marks live-tested
    behaviour.


    Most guide calls need feature-flag query parameters, e.g. `supports_no_guide_category=true`, `supports_no_guide_city=true`,
    `supports_collab_guides=true`; without them the server can return an empty list.

    Requests need an `Origin` header; bursts return HTTP 429.'
  license:
    name: MIT
servers:
- url: https://backoffice-service-t57o3dxfca-nn.a.run.app
  description: Main API
- url: https://backoffice-service-onboarding-t57o3dxfca-nn.a.run.app
  description: Onboarding/auth host (login for new sessions)
- url: https://backoffice-service-recs-t57o3dxfca-nn.a.run.app
  description: Recommendations service
security:
- bearerAuth: []
tags:
- name: auth
- name: business
- name: feed
- name: lists
- name: misc
- name: notifications
- name: payments
- name: profile
- name: ranking
- name: reservations
- name: search
- name: social
- name: telemetry
paths:
  /api/token/:
    post:
      operationId: login
      tags:
      - auth
      servers:
      - url: https://backoffice-service-onboarding-t57o3dxfca-nn.a.run.app
      security: []
      parameters:
      - $ref: '#/components/parameters/OriginHeader'
      summary: Login (email or phone + password) — SimpleJWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/token/refresh/:
    post:
      operationId: refreshToken
      tags:
      - auth
      servers:
      - url: https://backoffice-service-onboarding-t57o3dxfca-nn.a.run.app
      security: []
      parameters:
      - $ref: '#/components/parameters/OriginHeader'
      summary: Refresh an access token — refresh token itself is not rotated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          description: invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/user/logged-in/:
    get:
      operationId: getLoggedIn
      tags:
      - auth
      servers:
      - url: https://backoffice-service-onboarding-t57o3dxfca-nn.a.run.app
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OriginHeader'
      summary: Current user's full profile (incl. email, phone_no, home_city, referrer, sessions)
      responses:
        '200':
          description: ok (shape observed live)
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        first_name:
                          type: string
                        last_name:
                          type: string
                        full_name:
                          type: string
                        phone_no:
                          type: string
                        created_dt:
                          type: string
                        username:
                          type: string
                        instagram_url:
                          nullable: true
                        tiktok_url:
                          nullable: true
                        photo:
                          nullable: true
                        profile_photo:
                          type: string
                        lock_scores:
                          type: boolean
                        public:
                          type: boolean
                        home_city:
                          type: string
                        email:
                          type: string
                        badge:
                          nullable: true
                        home_valid_city_id:
                          type: integer
                        school_badge:
                          nullable: true
                        new:
                          type: boolean
                        location_permission:
                          type: boolean
                        notification_permission:
                          type: boolean
                        contacts_permission:
                          type: boolean
                        contacts_permission_status:
                          type: string
                        photo_permission:
                          type: boolean
                        photo_permission_status:
                          type: string
                        has_personalized_recs:
                          type: boolean
                        referrer:
                          type: string
                        referral_link:
                          type: string
                        status:
                          type: string
                        sessions:
                          type: integer
                        bio:
                          nullable: true
                        reservation_priority:
                          type: integer
                        reservation_priority_points:
                          type: integer
                        sc_nominations:
                          type: integer
                        has_supper_club:
                          type: boolean
                        vip_nominations:
                          type: integer
                        has_vip:
                          type: boolean
                        device:
                          type: string
                        school:
                          nullable: true
                        school_grad_year:
                          nullable: true
                        school_leaderboard_access:
                          type: boolean
                        school_referral_link:
                          nullable: true
                        company:
                          nullable: true
                        company_referral_link:
                          nullable: true
                        qr_code:
                          type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-app-method: getUserSecure
      x-verified: true
  /api/user/u/{uuid}/:
    put:
      operationId: updateUser
      tags:
      - auth
      security:
      - bearerAuth: []
      summary: Session heartbeat — sync FCM/live-activity tokens & session info; returns full user object
      parameters:
      - $ref: '#/components/parameters/OriginHeader'
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: supports_raw_password
        in: query
        required: false
        schema:
          type: string
        description: Sent by the app (read from the Beli 10.2.0 client).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fcm_token:
                  type:
                  - string
                  - 'null'
                live_activity_token:
                  type:
                  - string
                  - 'null'
                sessions: {}
                last_login:
                  type:
                  - string
                  - 'null'
                  format: date-time
                version:
                  type:
                  - string
                  - 'null'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-app-method: putUser
  /api/device/{deviceId}/:
    put:
      operationId: updateDevice
      tags:
      - auth
      security:
      - bearerAuth: []
      summary: Update device attribution record (AppsFlyer); request body not captured
      parameters:
      - $ref: '#/components/parameters/OriginHeader'
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Body not captured in reference traffic (AppsFlyer attribution fields).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-app-method: putDevice
  /api/app-rank/{uuid}/:
    get:
      operationId: getAppRank
      tags:
      - profile
      security:
      - bearerAuth: []
      summary: App-wide rank for a user
      parameters:
      - $ref: '#/components/parameters/OriginHeader'
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ok (shape observed live)
          content:
            application/json:
              schema:
                type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-verified: true
  /api/check-user-settings/:
    get:
      operationId: getCheckUserSettings
      tags:
      - profile
      security:
      - bearerAuth: []
      summary: Check user settings status
      parameters:
      - $ref: '#/components/parameters/OriginHeader'
      - name: user
        in: query
        required: true
        schema:
          type: string
        description: Sent by the app (read from the Beli 10.2.0 client).
      - name: field_names
        in: query
        required: true
        schema:
          type: string
        description: Sent by the app (read from the Beli 10.2.0 client).
      responses:
        '200':
          description: ok (shape observed live)
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_access:
                    type: boolean
                  settings:
                    type: array
                    items: {}
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-app-method: checkUserSettings
      x-verified: true
  /api/count-ranked-this-year/{uuid}/:
    get:
      operationId: getCountRankedThisYear
      tags:
      - profile
      security:
      - bearerAuth: []
      summary: Count of places ranked by the user this year
      parameters:
