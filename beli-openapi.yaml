components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        full_name:
          type: string
        username:
          type: string
        created_dt:
          type: string
          format: date-time
        instagram_url:
          type:
          - string
          - 'null'
        tiktok_url:
          type:
          - string
          - 'null'
        photo:
          type:
          - string
          - 'null'
        profile_photo:
          type:
          - string
          - 'null'
        public:
          type: boolean
        school:
          type:
          - string
          - 'null'
        company:
          type:
          - string
          - 'null'
        has_supper_club:
          type: boolean
        has_vip:
          type: boolean
        is_playlist_eligible:
          type: boolean
      required:
      - id
      - username
    UserExtended:
      description: 'Extended profile shape returned by self/detail endpoints (adds contact + onboarding fields on top of the
        base User shape).

        '
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        properties:
          phone_no:
            type:
            - string
            - 'null'
          email:
            type:
            - string
            - 'null'
          home_city:
            type:
            - string
            - 'null'
          bio:
            type:
            - string
            - 'null'
          referrer: {}
          referral_link:
            type:
            - string
            - 'null'
          sessions: {}
          reservation_priority: {}
          qr_code:
            type:
            - string
            - 'null'
          following:
            type:
            - boolean
            - 'null'
